name: Seguridad

# Qué es obligatorio para integrar y cómo se publica: docs/README.md, sección "Publicación".

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # En master no se cancela: un push de la bóveda no debe interrumpir el CI de una integración de código.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cambios:
    name: Cambios
    runs-on: ubuntu-latest
    outputs:
      codigo: ${{ steps.diff.outputs.codigo }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        # Si el diff no se puede calcular, se trata como código.
        run: |
          if git diff --quiet "$BASE_SHA" HEAD -- . ':(exclude)docs' 2>/dev/null; then
            echo "codigo=false" >> "$GITHUB_OUTPUT"
          else
            echo "codigo=true" >> "$GITHUB_OUTPUT"
          fi

  rls:
    name: Tests de base de datos (pgTAP)
    needs: cambios
    if: needs.cambios.outputs.codigo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - run: supabase db start
      - run: supabase test db

  a11y:
    name: Accesibilidad (AXE) y secretos en el bundle
    needs: cambios
    if: needs.cambios.outputs.codigo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: pnpm
      # Va en este job, ya obligatorio, para no añadir otro check a la protección de master.
      - name: La versión supera la de master
        if: github.event_name == 'pull_request'
        run: sh scripts/comprobar-version.sh "${{ github.event.pull_request.base.sha }}"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Sin claves secretas en el bundle
        run: '! grep -rIE "sb_secret_|SERVICE_ROLE" dist/gift-card'
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:a11y

  fugas:
    name: Fugas (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (historial, mensajes, rama y PR)
        env:
          GITLEAKS_VERSION: 8.30.1
          # El texto del PR va por variable de entorno, nunca interpolado en el script.
          PR_TEXTO: ${{ github.event.pull_request.title }} ${{ github.event.pull_request.body }}
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --redact --no-banner --config .gitleaks.toml
          { git log --format=%B; printf '%s\n%s\n' "$RAMA" "$PR_TEXTO"; } | ./gitleaks stdin --redact --no-banner --config .gitleaks.toml
