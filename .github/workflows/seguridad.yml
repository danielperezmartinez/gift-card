name: Seguridad

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  rls:
    name: Tests de base de datos (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - run: supabase db start
      - run: supabase test db

  a11y:
    name: Accesibilidad (AXE) y secretos en el bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Sin claves secretas en el bundle
        run: '! grep -rIE "sb_secret_|SERVICE_ROLE" dist/gift-card'
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:a11y
